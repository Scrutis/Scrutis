name: Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          # username: ${{ vars.DOCKERHUB_USERNAME }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker metadata for web
        id: meta-web
        uses: docker/metadata-action@v6
        with:
          images: arcayth/scrutis-web
          tags: |
            type=sha,format=short

      - name: Build and push web image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ${{ steps.meta-web.outputs.tags }}
          labels: ${{ steps.meta-web.outputs.labels }}

      - name: Docker metadata for worker
        id: meta-worker
        uses: docker/metadata-action@v6
        with:
          images: arcayth/scrutis-worker
          tags: |
            type=sha,format=short

      - name: Build and push worker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/worker/Dockerfile
          push: true
          tags: ${{ steps.meta-worker.outputs.tags }}
          labels: ${{ steps.meta-worker.outputs.labels }}

      - name: Update Helm image tag
        env:
          WEB_TAG: ${{ steps.meta-web.outputs.version }}
          WORKER_TAG: ${{ steps.meta-worker.outputs.version }}
        run: |
          yq -i '.image.tag = strenv(WEB_TAG)' infra/helm/web/values.yaml
          yq -i '.image.tag = strenv(WORKER_TAG)' infra/helm/worker/values.yaml

      - name: Commit Helm changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add infra/helm/web/values.yaml
          git add infra/helm/worker/values.yaml

          git diff --cached --quiet || \
            git commit -m "chore(deploy): update web image to ${{ steps.meta-web.outputs.version }}"

          git push